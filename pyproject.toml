[project]
name = "princeton-bayesflow-workshop-2026"
version = "0.1.0"
description = "Hands-on simulation-based inference with BayesFlow: cortical circuits and decision-making models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bayesflow>=2.1,<2.2",
    "jax>=0.7,<1",
    "pymc>=5.28.1,<6",
    "arviz>=0.23,<1",
    "hnn-core[parallel]==0.6.1",
    "scikit-learn>=1.7,<2",
    "ipykernel>=7.1,<8",
    "ipywidgets>=8.1,<9",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
